<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Niva3D v0.08.2 Debug2</title>
<style>
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block}
#debug{position:fixed;top:10px;left:10px;background:#000c;padding:10px;z-index:5}
</style>
</head>
<body>
<div id="debug">START</div>

<script type="module">
const dbg=document.getElementById('debug');
function log(t){dbg.innerHTML+= '<br>'+t;}

async function start(){

try{

log("loading THREE");

const THREE = await import(
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'
);

log("THREE OK");

const GLTF = await import(
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js'
);

log("GLTFLoader OK");

const RAPIER = await import(
'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat/rapier.es.js'
);

log("Rapier download OK");

await RAPIER.default.init();

log("Rapier init OK");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd3ff);

const camera=new THREE.PerspectiveCamera(
55,innerWidth/innerHeight,.1,1000
);

const renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445533,2));

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(100,400),
new THREE.MeshStandardMaterial({color:0x587c3b})
);

ground.rotation.x=-Math.PI/2;
ground.position.z=-100;
scene.add(ground);

log("Scene OK");

const world=new RAPIER.default.World({x:0,y:-9.81,z:0});

const rb=world.createRigidBody(
RAPIER.default.RigidBodyDesc.dynamic()
.setTranslation(0,2,0)
.setAdditionalMass(1200)
);

world.createCollider(
RAPIER.default.ColliderDesc.cuboid(1,.45,1.8),
rb
);

log("Physics OK");

let car;

new GLTF.GLTFLoader().load(
'./niva_lowpoly_game_ready.glb',
g=>{
car=g.scene;
scene.add(car);
log("NIVA GLB OK");
},
undefined,
e=>log("NIVA ERROR")
);


function loop(){

requestAnimationFrame(loop);

world.step();

let p=rb.translation();

if(car){
car.position.set(p.x,p.y-.45,p.z);
}

camera.position.set(
p.x,12,p.z+18
);

camera.lookAt(p.x,0,p.z-8);

renderer.render(scene,camera);

}

loop();

}catch(e){
log("ERROR: "+e.message);
}

}

start();

</script>
</body>
</html>
