<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLB Debug</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
canvas{display:block}
#info{position:fixed;top:10px;left:10px;color:white;background:#000b;padding:10px;z-index:10}
</style>
</head>
<body>
<div id="info">Старт...</div>

<script type="module">

const info=document.getElementById('info');

function log(t){
 info.innerHTML += "<br>"+t;
}

async function start(){

try{

log("Загрузка Three");

const THREE = await import(
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'
);

log("Three OK");


const GLTFLoader = await import(
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js'
);

log("GLTFLoader OK");


const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);


const camera=new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.set(0,3,6);


const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);


scene.add(new THREE.AmbientLight(0xffffff,2));


const ground=new THREE.Mesh(
new THREE.PlaneGeometry(20,20),
new THREE.MeshBasicMaterial({color:0x227722})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

log("Сцена создана");


const loader=new GLTFLoader.GLTFLoader();

loader.load(
'./niva_lowpoly_game_ready.glb',

(gltf)=>{

const model=gltf.scene;

model.position.set(0,0,0);

scene.add(model);

log("GLB ЗАГРУЖЕН");

camera.lookAt(model.position);

},

undefined,

(err)=>{
log("ОШИБКА GLB");
console.log(err);
}

);


function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

animate();


}catch(e){

log("ОШИБКА:");
log(e.message);

}

}

start();

</script>
</body>
</html>
