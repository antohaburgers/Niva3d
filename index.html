<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Niva GLB Test Fixed</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
canvas{display:block}
#info{position:fixed;top:10px;left:10px;color:white;background:#000a;padding:10px}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

</head>
<body>
<div id="info">Старт...</div>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const info=document.getElementById('info');

function msg(t){
    info.innerHTML += "<br>"+t;
}

msg("Three OK");


const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);


const camera=new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.set(0,3,6);


const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);


scene.add(new THREE.AmbientLight(0xffffff,2));


const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(20,20),
    new THREE.MeshBasicMaterial({color:0x338833})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);


msg("Сцена OK");


const loader=new GLTFLoader();

loader.load(
    './niva_lowpoly_game_ready.glb',
    (gltf)=>{

        const car=gltf.scene;

        car.position.set(0,0,0);

        scene.add(car);

        msg("GLB загружен");

        camera.lookAt(car.position);

    },
    ()=>{
        msg("Загрузка GLB...");
    },
    (error)=>{
        msg("Ошибка GLB");
        console.log(error);
    }
);


function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

animate();


window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
