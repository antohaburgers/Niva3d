<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niva3D v0.03.1</title>
<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}
canvas{display:block;}
#error{
    position:absolute;
    top:10px;
    left:10px;
    color:#ff5555;
    background:#111;
    padding:10px;
    display:none;
    z-index:10;
}
</style>
</head>
<body>
<div id="error"></div>

<script type="module">
const errorBox=document.getElementById('error');

window.onerror=(msg)=>{
    errorBox.style.display='block';
    errorBox.innerHTML='Ошибка: '+msg;
};

try {

import('./three.module.js').then((THREE)=>{

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,30,120);

const camera=new THREE.PerspectiveCamera(
55,
innerWidth/innerHeight,
0.1,
500
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);


scene.add(new THREE.HemisphereLight(0xffffff,0x445522,1.5));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,30,10);
scene.add(sun);


// Нива
const niva=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2,0.8,3.5),
new THREE.MeshStandardMaterial({color:0x236b32})
);
body.position.y=0.8;
niva.add(body);

const wheelGeo=new THREE.CylinderGeometry(0.4,0.4,0.3,16);

for(const x of [-0.9,0.9]){
for(const z of [-1.1,1.1]){
const wheel=new THREE.Mesh(
wheelGeo,
new THREE.MeshStandardMaterial({color:0x111111})
);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,0.45,z);
niva.add(wheel);
}
}

scene.add(niva);


// Чанки
const CHUNK_SIZE=30;
const VIEW_DISTANCE=2;
const chunks=new Map();


function createChunk(x,z){

const group=new THREE.Group();

const terrain=new THREE.Mesh(
new THREE.PlaneGeometry(CHUNK_SIZE,CHUNK_SIZE,4,4),
new THREE.MeshStandardMaterial({color:0x557d3c})
);

terrain.rotation.x=-Math.PI/2;
group.add(terrain);


// деревья
for(let i=0;i<2;i++){

const tree=new THREE.Mesh(
new THREE.ConeGeometry(1,3,8),
new THREE.MeshStandardMaterial({color:0x1e5c25})
);

tree.position.set(
(Math.random()-0.5)*CHUNK_SIZE,
1.5,
(Math.random()-0.5)*CHUNK_SIZE
);

group.add(tree);
}

group.position.set(
x*CHUNK_SIZE,
0,
z*CHUNK_SIZE
);

scene.add(group);
chunks.set(`${x}_${z}`,group);

}


function updateChunks(){

const cx=Math.floor(niva.position.x/CHUNK_SIZE);
const cz=Math.floor(niva.position.z/CHUNK_SIZE);


for(let x=cx-VIEW_DISTANCE;x<=cx+VIEW_DISTANCE;x++){
for(let z=cz-VIEW_DISTANCE;z<=cz+VIEW_DISTANCE;z++){

const key=`${x}_${z}`;

if(!chunks.has(key)){
createChunk(x,z);
}

}
}

}


// запуск
updateChunks();


function animate(){

requestAnimationFrame(animate);

niva.position.z-=0.05;

updateChunks();

camera.position.set(
niva.position.x,
12,
niva.position.z+18
);

camera.lookAt(
niva.position.x,
0,
niva.position.z-5
);

renderer.render(scene,camera);

}

animate();


addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});


}).catch(e=>{
errorBox.style.display='block';
errorBox.innerHTML='Не найден three.module.js: '+e;
});

}catch(e){
errorBox.style.display='block';
errorBox.innerHTML=e;
}

</script>
</body>
</html>
