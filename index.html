<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niva3D v0.03 - Chunks</title>
<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
}
canvas{display:block;}
</style>
</head>
<body>

<script type="module">
import * as THREE from './three.module.js';

// =====================
// БАЗА ИГРЫ
// =====================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 140);

const camera = new THREE.PerspectiveCamera(
    55,
    innerWidth / innerHeight,
    0.1,
    500
);

// высокая камера третьего лица
camera.position.set(0, 12, 16);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);


// Свет
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,1.5));

const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(20,30,10);
scene.add(sun);


// =====================
// НИВА (пока прототип)
// =====================

const niva = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.BoxGeometry(2,0.8,3.5),
    new THREE.MeshStandardMaterial({color:0x236b32})
);

body.position.y = 0.8;
niva.add(body);


const wheelGeo = new THREE.CylinderGeometry(0.4,0.4,0.3,16);

for(const x of [-0.9,0.9]){
    for(const z of [-1.1,1.1]){
        const w = new THREE.Mesh(
            wheelGeo,
            new THREE.MeshStandardMaterial({color:0x111111})
        );
        w.rotation.z=Math.PI/2;
        w.position.set(x,0.45,z);
        niva.add(w);
    }
}

scene.add(niva);


// =====================
// ЧАНКИ МИРА
// =====================

const CHUNK_SIZE = 30;
const VIEW_DISTANCE = 3;

let chunks = new Map();


function createChunk(x,z){

    const group = new THREE.Group();

    const terrain = new THREE.Mesh(
        new THREE.PlaneGeometry(CHUNK_SIZE,CHUNK_SIZE,10,10),
        new THREE.MeshStandardMaterial({
            color:0x557d3c,
            roughness:1
        })
    );

    terrain.rotation.x=-Math.PI/2;

    // лёгкая неровность
    const pos = terrain.geometry.attributes.position;

    for(let i=0;i<pos.count;i++){
        pos.setZ(i, Math.sin(i*3.1+x)*0.15);
    }

    pos.needsUpdate=true;

    group.add(terrain);


    // простые деревья
    for(let i=0;i<3;i++){

        const tree = new THREE.Mesh(
            new THREE.ConeGeometry(1,3,8),
            new THREE.MeshStandardMaterial({color:0x1f5c25})
        );

        tree.position.set(
            (Math.random()-0.5)*CHUNK_SIZE,
            1.5,
            (Math.random()-0.5)*CHUNK_SIZE
        );

        group.add(tree);
    }


    group.position.set(
        x*CHUNK_SIZE,
        0,
        z*CHUNK_SIZE
    );

    scene.add(group);

    chunks.set(`${x}_${z}`,group);
}


function updateChunks(){

    const cx=Math.floor(niva.position.x/CHUNK_SIZE);
    const cz=Math.floor(niva.position.z/CHUNK_SIZE);


    for(let x=cx-VIEW_DISTANCE;x<=cx+VIEW_DISTANCE;x++){
        for(let z=cz-VIEW_DISTANCE;z<=cz+VIEW_DISTANCE;z++){

            const key=`${x}_${z}`;

            if(!chunks.has(key)){
                createChunk(x,z);
            }
        }
    }


    // удаляем старые чанки
    for(const [key,obj] of chunks){

        const [x,z]=key.split("_").map(Number);

        if(
            Math.abs(x-cx)>VIEW_DISTANCE ||
            Math.abs(z-cz)>VIEW_DISTANCE
        ){
            scene.remove(obj);
            chunks.delete(key);
        }
    }
}


// =====================
// ДВИЖЕНИЕ
// =====================

function animate(){

    requestAnimationFrame(animate);

    niva.position.z-=0.08;

    updateChunks();


    // камера следует сверху-сзади
    camera.position.x=niva.position.x;
    camera.position.z=niva.position.z+16;
    camera.position.y=12;

    camera.lookAt(
        niva.position.x,
        0,
        niva.position.z-5
    );


    renderer.render(scene,camera);
}

updateChunks();
animate();


addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
