<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Niva3D v0.08.1 DEBUG</title>
<style>
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block}
#debug{position:fixed;top:10px;left:10px;background:#000a;padding:10px;z-index:5}
#joy{position:fixed;left:35px;bottom:120px;width:140px;height:140px;border-radius:50%;background:#fff2;border:2px solid #fff5}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:#fff9}
</style>
</head>
<body>
<div id="debug">START...</div>
<div id="joy"><div id="knob"></div></div>

<script type="module">
const dbg=document.getElementById('debug');
function log(t){dbg.innerHTML+=t+"<br>";}

window.onerror=(e)=>log("ERROR: "+e);

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
log("Three OK");

import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat/rapier.es.js';

await RAPIER.init();
log("Rapier OK");


const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd3ff);
scene.fog=new THREE.Fog(0x9bd3ff,40,180);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445533,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,40,20);
scene.add(sun);


// земля
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(100,400),
new THREE.MeshStandardMaterial({color:0x587c3b})
);
ground.rotation.x=-Math.PI/2;
ground.position.z=-100;
scene.add(ground);


// физика
const world=new RAPIER.World({x:0,y:-9.81,z:0});

const groundBody=world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
world.createCollider(
RAPIER.ColliderDesc.cuboid(50,.1,200),
groundBody
);

log("Physics world OK");


// чанки
const chunks=new Map();
function chunk(z){
const g=new THREE.Group();

const road=new THREE.Mesh(
new THREE.PlaneGeometry(8,40),
new THREE.MeshStandardMaterial({color:0x70563a})
);
road.rotation.x=-Math.PI/2;
road.position.y=.02;
g.add(road);

g.position.z=z;
scene.add(g);
chunks.set(z,g);
}

for(let z=-80;z<120;z+=40)chunk(z);

log("Chunks OK");


// физическая Нива
const carBody=world.createRigidBody(
RAPIER.RigidBodyDesc.dynamic()
.setTranslation(0,2,0)
.setAdditionalMass(1200)
);

world.createCollider(
RAPIER.ColliderDesc.cuboid(1,.45,1.8),
carBody
);

log("Car physics OK");


// модель
let car;

new GLTFLoader().load(
'./niva_lowpoly_game_ready.glb',
g=>{
car=g.scene;
scene.add(car);
log("GLB Niva OK");
},
undefined,
e=>log("GLB ERROR")
);


// управление
let gas=0,steer=0,active=false;
const joy=document.getElementById('joy');
const knob=document.getElementById('knob');
let c={x:0,y:0};

joy.ontouchstart=e=>{
active=true;
let r=joy.getBoundingClientRect();
c={x:r.left+70,y:r.top+70};
};

joy.ontouchmove=e=>{
if(!active)return;
let t=e.touches[0];
let dx=t.clientX-c.x;
let dy=t.clientY-c.y;
let m=45;
let l=Math.hypot(dx,dy);
if(l>m){dx=dx/l*m;dy=dy/l*m;}
knob.style.left=45+dx+"px";
knob.style.top=45+dy+"px";
steer=dx/m;
gas=-dy/m;
};

joy.ontouchend=()=>{
gas=0;steer=0;
knob.style.left="45px";
knob.style.top="45px";
};


function loop(){
requestAnimationFrame(loop);

let v=carBody.linvel();

carBody.setLinvel({
x:steer*2,
y:v.y,
z:-gas*10
},true);

world.step();

let p=carBody.translation();

if(car){
car.position.set(p.x,p.y-.45,p.z);
}

camera.position.set(p.x,12,p.z+18);
camera.lookAt(p.x,0,p.z-8);

renderer.render(scene,camera);
}

loop();


addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
