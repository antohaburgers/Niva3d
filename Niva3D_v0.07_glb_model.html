<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Niva3D v0.07 GLB</title>
<style>
html,body{margin:0;overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd3ff);
scene.fog = new THREE.Fog(0x9bd3ff,50,180);

const camera = new THREE.PerspectiveCamera(
55,
innerWidth/innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);


// свет
scene.add(new THREE.HemisphereLight(0xffffff,0x445533,1.8));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,50,20);
scene.add(sun);


// земля
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(200,400),
new THREE.MeshStandardMaterial({color:0x587c3b})
);

ground.rotation.x=-Math.PI/2;
ground.position.z=-100;
scene.add(ground);


// дорога
const road = new THREE.Mesh(
new THREE.PlaneGeometry(8,400),
new THREE.MeshStandardMaterial({color:0x70563a})
);

road.rotation.x=-Math.PI/2;
road.position.y=0.02;
road.position.z=-100;
scene.add(road);


// загрузка Нивы
let niva;

const loader = new GLTFLoader();

loader.load(
'./niva_lowpoly_game_ready.glb',
(gltf)=>{

    niva=gltf.scene;

    niva.scale.set(1,1,1);
    niva.position.set(0,0,0);

    scene.add(niva);

    console.log("Нива загружена");

},
undefined,
(error)=>{
    console.log("Ошибка загрузки Нивы",error);
}
);


// движение
let speed=0.08;

function animate(){

requestAnimationFrame(animate);

if(niva){

    niva.position.z-=speed;

    camera.position.set(
        niva.position.x,
        10,
        niva.position.z+18
    );

    camera.lookAt(
        niva.position.x,
        1,
        niva.position.z-8
    );

}

renderer.render(scene,camera);

}


animate();


addEventListener('resize',()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>
</html>
